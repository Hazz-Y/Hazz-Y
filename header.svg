<svg xmlns="http://www.w3.org/2000/svg" width="850" height="180" viewBox="0 0 850 180">
  <defs>
    <!-- Fonts -->
    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 40px;
        letter-spacing: 2px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 15px;
        letter-spacing: 1px;
        fill: #a3a3a3;
      }
      .console-label {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
        font-weight: 600;
        font-size: 13px;
        fill: #737373;
      }
      .console-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 14px;
        fill: #ffffff;
      }
    </style>

    <!-- Subtle Radial Backgrounds -->
    <radialGradient id="greyGlow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#262626" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#090909" stop-opacity="0" />
    </radialGradient>
    
    <!-- Grid Mask for Fading Edges -->
    <radialGradient id="gridMaskGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="850" height="180" fill="url(#gridMaskGrad)"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="850" height="180" fill="#090909"/>

  <!-- Matte Glow -->
  <circle cx="150" cy="90" r="130" fill="url(#greyGlow)" />
  <circle cx="700" cy="90" r="150" fill="url(#greyGlow)" opacity="0.5" />

  <!-- Centered Tech Grid (masked) -->
  <g mask="url(#gridMask)" opacity="0.08">
    <path d="M 0,15 L 850,15 M 0,30 L 850,30 M 0,45 L 850,45 M 0,60 L 850,60 M 0,75 L 850,75 M 0,90 L 850,90 M 0,105 L 850,105 M 0,120 L 850,120 M 0,135 L 850,135 M 0,150 L 850,150 M 0,165 L 850,165" stroke="#ffffff" stroke-width="0.5" />
    <path d="M 30,0 L 30,180 M 60,0 L 60,180 M 90,0 L 90,180 M 120,0 L 120,180 M 150,0 L 150,180 M 180,0 L 180,180 M 210,0 L 210,180 M 240,0 L 240,180 M 270,0 L 270,180 M 300,0 L 300,180 M 330,0 L 330,180 M 360,0 L 360,180 M 390,0 L 390,180 M 420,0 L 420,180 M 450,0 L 450,180 M 480,0 L 480,180 M 510,0 L 510,180 M 540,0 L 540,180 M 570,0 L 570,180 M 600,0 L 600,180 M 630,0 L 630,180 M 660,0 L 660,180 M 690,0 L 690,180 M 720,0 L 720,180 M 750,0 L 750,180 M 780,0 L 780,180 M 810,0 L 810,180" stroke="#ffffff" stroke-width="0.5" />
  </g>

  <!-- Left: Main Info -->
  <g transform="translate(50, 40)">
    <!-- Sleek Vertical Accent Line -->
    <rect x="-10" y="8" width="2" height="52" fill="#ffffff" opacity="0.3" />
    
    <!-- Title -->
    <text x="10" y="36" class="title-text">HARSH YADAV</text>
    
    <!-- Subtitle -->
    <text x="12" y="60" class="subtitle-text">AI Engineer · Robotics · Edge AI · Embedded Systems</text>
  </g>

  <!-- Divider Line -->
  <line x1="50" y1="122" x2="800" y2="122" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <!-- Bottom Console -->
  <g transform="translate(50, 134)">
    <text x="12" y="20" class="console-label">// focus_</text>
    
    <!-- Sentence Container -->
    <g transform="translate(95, 20)">
      <!-- Sentence 1 -->
      <text class="console-text" opacity="0">
        Building systems at the intersection of AI and hardware.
        <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.03; 0.22; 0.25; 1" dur="16s" repeatCount="indefinite" begin="0s" />
      </text>
      
      <!-- Sentence 2 -->
      <text class="console-text" opacity="0">
        Deploying quantized CV models on resource-constrained edge hardware.
        <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.25; 0.28; 0.47; 0.50; 1" dur="16s" repeatCount="indefinite" begin="0s" />
      </text>
      
      <!-- Sentence 3 -->
      <text class="console-text" opacity="0">
        Engineering real-time sign language recognition wearables.
        <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.50; 0.53; 0.72; 0.75; 1" dur="16s" repeatCount="indefinite" begin="0s" />
      </text>
      
      <!-- Sentence 4 -->
      <text class="console-text" opacity="0">
        Designing EKF-fused SLAM and autonomous navigation stacks.
        <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.75; 0.78; 0.97; 1; 1" dur="16s" repeatCount="indefinite" begin="0s" />
      </text>
    </g>
  </g>
</svg>
