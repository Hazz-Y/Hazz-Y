<svg xmlns="http://www.w3.org/2000/svg" width="850" height="240" viewBox="0 0 850 240">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=Fira+Code:wght@400;500;600&amp;display=swap');
      .title-text {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 48px;
        letter-spacing: 3px;
      }
      .subtitle-text {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        font-size: 16px;
        letter-spacing: 1.5px;
        fill: #94a3b8;
      }
      .badge-label {
        font-family: 'Fira Code', 'Segoe UI Mono', 'Roboto Mono', Monaco, Courier, monospace;
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.5px;
      }
      .console-label {
        font-family: 'Fira Code', 'Segoe UI Mono', 'Roboto Mono', Monaco, Courier, monospace;
        font-weight: 500;
        font-size: 12px;
        fill: #6366f1;
      }
      .console-text {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        font-size: 16px;
        letter-spacing: 0.5px;
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="badgeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f87171" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glowing Radial Backgrounds -->
    <radialGradient id="cyanGlow" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="indigoGlow" cx="70%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    
    <!-- Grid Mask for Fading Edges -->
    <radialGradient id="gridMaskGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="850" height="240" fill="url(#gridMaskGrad)"/>
    </mask>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="240" fill="#080710"/>

  <!-- Moving Nebula Glows -->
  <circle cx="200" cy="80" r="150" fill="url(#cyanGlow)" filter="url(#subtleGlow)">
    <animate attributeName="cx" values="200; 250; 200" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="80; 120; 80" dur="16s" repeatCount="indefinite" />
  </circle>
  <circle cx="650" cy="140" r="180" fill="url(#indigoGlow)" filter="url(#subtleGlow)">
    <animate attributeName="cx" values="650; 600; 650" dur="14s" repeatCount="indefinite" />
    <animate attributeName="cy" values="140; 100; 140" dur="18s" repeatCount="indefinite" />
  </circle>

  <!-- Centered Tech Grid (masked) -->
  <g mask="url(#gridMask)" opacity="0.12">
    <path d="M 0,20 L 850,20 M 0,40 L 850,40 M 0,60 L 850,60 M 0,80 L 850,80 M 0,100 L 850,100 M 0,120 L 850,120 M 0,140 L 850,140 M 0,160 L 850,160 M 0,180 L 850,180 M 0,200 L 850,200 M 0,220 L 850,220" stroke="#94a3b8" stroke-width="0.5" />
    <path d="M 40,0 L 40,240 M 80,0 L 80,240 M 120,0 L 120,240 M 160,0 L 160,240 M 200,0 L 200,240 M 240,0 L 240,240 M 280,0 L 280,240 M 320,0 L 320,240 M 360,0 L 360,240 M 400,0 L 400,240 M 440,0 L 440,240 M 480,0 L 480,240 M 520,0 L 520,240 M 560,0 L 560,240 M 600,0 L 600,240 M 640,0 L 640,240 M 680,0 L 680,240 M 720,0 L 720,240 M 760,0 L 760,240 M 800,0 L 800,240" stroke="#94a3b8" stroke-width="0.5" />
  </g>

  <!-- Tech Brackets / Decorative borders -->
  <!-- Top Left Corner -->
  <path d="M 25 35 L 25 20 L 40 20" stroke="#6366f1" stroke-width="1.5" fill="none" opacity="0.6" />
  <!-- Bottom Left Corner -->
  <path d="M 25 205 L 25 220 L 40 220" stroke="#6366f1" stroke-width="1.5" fill="none" opacity="0.6" />
  <!-- Top Right Corner -->
  <path d="M 825 35 L 825 20 L 810 20" stroke="#6366f1" stroke-width="1.5" fill="none" opacity="0.6" />
  <!-- Bottom Right Corner -->
  <path d="M 825 205 L 825 220 L 810 220" stroke="#6366f1" stroke-width="1.5" fill="none" opacity="0.6" />

  <!-- Left: Main Info -->
  <g transform="translate(50, 65)">
    <!-- Tech Accent block -->
    <rect x="-10" y="5" width="3" height="65" fill="#6366f1" rx="1.5" />
    
    <text x="10" y="42" class="title-text" fill="url(#nameGrad)">HARSH YADAV</text>
    <!-- Blinking Cursor after Name -->
    <rect x="355" y="10" width="10" height="36" fill="#818cf8" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite" />
    </rect>
    <text x="10" y="76" class="subtitle-text">AI Engineer · Robotics · Edge AI · Embedded Systems</text>
  </g>

  <!-- Right: Tech Badges -->
  <!-- Badge 1: 16 Patents -->
  <g transform="translate(660, 45)">
    <rect width="140" height="32" rx="6" fill="url(#badgeGrad1)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
    <!-- Pulse dot -->
    <circle cx="16" cy="16" r="3" fill="#818cf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="20" class="badge-label" fill="#a5b4fc">16 PATENTS</text>
  </g>

  <!-- Badge 2: SIH Finalist -->
  <g transform="translate(660, 92)">
    <rect width="140" height="32" rx="6" fill="url(#badgeGrad2)" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
    <!-- Pulse dot -->
    <circle cx="16" cy="16" r="3" fill="#34d399">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="0.5s" />
    </circle>
    <text x="32" y="20" class="badge-label" fill="#6ee7b7">SIH '25 FINALIST</text>
  </g>

  <!-- Badge 3: Techgium Top 7 -->
  <g transform="translate(660, 139)">
    <rect width="140" height="32" rx="6" fill="url(#badgeGrad3)" stroke="#f87171" stroke-width="1" stroke-opacity="0.4" />
    <!-- Pulse dot -->
    <circle cx="16" cy="16" r="3" fill="#f87171">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="1s" />
    </circle>
    <text x="32" y="20" class="badge-label" fill="#fca5a5">TECHGIUM TOP 7</text>
  </g>

  <!-- Bottom Terminal Container for Changing Sentences -->
  <g transform="translate(50, 185)">
    <!-- Terminal Bar/Box -->
    <rect width="750" height="36" rx="6" fill="#0d0c18" stroke="rgba(99, 102, 241, 0.15)" stroke-width="1" />
    
    <!-- Console prompt symbol -->
    <text x="15" y="22" class="console-label">user@harsh:~$</text>
    
    <!-- Sentence Container -->
    <g transform="translate(130, 22)">
      <!-- Sentence 1 -->
      <text class="console-text" fill="#e2e8f0" opacity="0">
        Building systems at the intersection of AI and hardware...
        <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.03; 0.22; 0.25; 1" dur="16s" repeatCount="indefinite" begin="0s" />
      </text>
      
      <!-- Sentence 2 -->
      <text class="console-text" fill="#e2e8f0" opacity="0">
        Deploying quantized CV models on resource-constrained edge hardware...
        <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.25; 0.28; 0.47; 0.50; 1" dur="16s" repeatCount="indefinite" begin="0s" />
      </text>
      
      <!-- Sentence 3 -->
      <text class="console-text" fill="#e2e8f0" opacity="0">
        Engineering real-time sign language recognition wearables...
        <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.50; 0.53; 0.72; 0.75; 1" dur="16s" repeatCount="indefinite" begin="0s" />
      </text>
      
      <!-- Sentence 4 -->
      <text class="console-text" fill="#e2e8f0" opacity="0">
        Designing EKF-fused SLAM and autonomous navigation stacks...
        <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.75; 0.78; 0.97; 1; 1" dur="16s" repeatCount="indefinite" begin="0s" />
      </text>
    </g>
  </g>
</svg>
